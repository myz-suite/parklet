<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ParkingLot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>🅿 ParkingLot</h1>
      <span id="status-dot" class="dot offline"></span>
      <span id="status-text">disconnected</span>
    </header>

    <section id="config">
      <label
        >Server URL <input id="server-url" type="text" placeholder="http://127.0.0.1:8787"
      /></label>
      <label>Token <input id="token" type="password" placeholder="pair token from server" /></label>
      <div class="actions">
        <button id="save">Save &amp; Connect</button>
        <button id="retry" class="secondary" disabled>Retry</button>
      </div>
      <p id="guidance" class="hint">
        未配置：运行 <code>plt serve</code> 并复制其输出的 pair token。
      </p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
