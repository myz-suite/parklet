<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ParkingLot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>🅿 ParkingLot</h1>
      <span id="status-dot" class="dot offline"></span>
      <span id="status-text">disconnected</span>
    </header>

    <section id="config">
      <label
        >Server URL <input id="server-url" type="text" placeholder="http://127.0.0.1:8787"
      /></label>
      <label>Token <input id="token" type="password" placeholder="pair token from server" /></label>
      <button id="save">Save &amp; Connect</button>
      <p class="hint">Start the server and copy the token from its output.</p>
    </section>

    <section id="approvals" class="hidden">
      <h2>Approval queue</h2>
      <ul id="approval-list"></ul>
      <p id="approvals-empty" class="hint">No pending operations.</p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
